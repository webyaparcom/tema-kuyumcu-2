  .modulex-zaman-kurulus-surgu-aralik:dir(rtl) { background: linear-gradient(to left, --accent-- 0 calc(14px + var(--oran) * (100% - 28px)), --cizgi-- 0); }
  .modulex-zaman-kurulus-surgu-aralik::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border: 5px solid --bg--; border-radius: 50%; background: --accent--; box-shadow: 0 0 0 2px --accent--, 0 6px 14px -4px color-mix(in srgb, --text-- 50%, transparent); transition: transform 0.2s ease; }
  .modulex-zaman-kurulus-surgu-aralik::-moz-range-thumb { width: 18px; height: 18px; border: 5px solid --bg--; border-radius: 50%; background: --accent--; box-shadow: 0 0 0 2px --accent--; }
  .modulex-zaman-kurulus-surgu-aralik:active::-webkit-slider-thumb { transform: scale(1.15); }

  .modulex-zaman-kurulus-surgu-tik { display: grid; justify-items: center; gap: 6px; padding: 0; border: 0; background: none; color: --muted--; font: inherit; font-size: 0.84rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; transition: color 0.2s ease; }
  .modulex-zaman-kurulus-surgu-tik::before { content: ""; width: 2px; height: 10px; border-radius: 2px; background: --cizgi--; transition: background-color 0.2s ease, height 0.2s ease; }
  .modulex-zaman-kurulus-surgu-tik:hover, .modulex-zaman-kurulus-surgu-tik[aria-current] { color: --text--; }
  .modulex-zaman-kurulus-surgu-tik.modulex-zaman-kurulus-surgu--gecti::before, .modulex-zaman-kurulus-surgu-tik[aria-current]::before { background: --accent--; }
  .modulex-zaman-kurulus-surgu-tik[aria-current]::before { height: 16px; }
  .modulex-zaman-kurulus-surgu-donemler { display: grid; gap: 16px; }
  .modulex-zaman-kurulus-surgu-donem { position: relative; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.5fr); align-items: center; gap: clamp(20px, 4vw, 56px); padding: clamp(24px, 4vw, 48px); overflow: hidden; border: 1px solid --cizgi--; border-radius: calc(--yuvarlak-- * 1.3); background: --bg--; }

  .modulex-zaman-kurulus-surgu--js .modulex-zaman-kurulus-surgu-donem { min-height: 320px; box-shadow: 0 30px 60px -44px color-mix(in srgb, --text-- 55%, transparent); }
  .modulex-zaman-kurulus-surgu-dyil { color: --accentInk--; font-size: clamp(3.4rem, 9vw, 7.5rem); font-weight: 900; letter-spacing: -0.05em; line-height: 0.85; font-variant-numeric: tabular-nums; overflow-wrap: normal; }
  .modulex-zaman-kurulus-surgu-donem--gorsel .modulex-zaman-kurulus-surgu-dyil { font-size: clamp(2.8rem, 5.6vw, 5.2rem); }
  .modulex-zaman-kurulus-surgu-dgovde { display: grid; align-content: center; gap: 12px; }
  .modulex-zaman-kurulus-surgu-dikon { color: --accentInk--; font-size: 30px; }
  .modulex-zaman-kurulus-surgu-kbaslik { font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 780; line-height: 1.2; }
  .modulex-zaman-kurulus-surgu-kmetin { color: --muted--; font-size: 1.05rem; line-height: 1.75; }
  .modulex-zaman-kurulus-surgu-gorsel { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: --yuvarlak--; }

  .modulex-zaman-kurulus-surgu-donem.modulex-zaman-kurulus-surgu--gir .modulex-zaman-kurulus-surgu-dyil { animation: modulex-zaman-kurulus-surgu-yil 0.7s ease both; }
  @keyframes modulex-zaman-kurulus-surgu-gir { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
  @keyframes modulex-zaman-kurulus-surgu-yil { from { opacity: 0; letter-spacing: 0.08em; } to { opacity: 1; letter-spacing: -0.05em; } }

  }
  @media (max-width: 768px) {
    .modulex-zaman-kurulus-surgu-surgu { grid-template-columns: minmax(0, 1fr); padding: 18px 16px 12px; }

    .modulex-zaman-kurulus-surgu-tik { font-size: 0.7rem; }
    .modulex-zaman-kurulus-surgu-centik:not(:first-child):not(:last-child) .modulex-zaman-kurulus-surgu-tik:not([aria-current]) bdi { visibility: hidden; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-kurulus-surgu :is(.modulex-zaman-kurulus-surgu-baslik, .modulex-zaman-kurulus-surgu-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-kurulus-surgu-baslik { line-height: 1.35; }

    .modulex-zaman-kurulus-surgu { padding-inline: 16px; }

  @media (prefers-reduced-motion: reduce) {

  }
</style>
<script>
  (() => {
    const P = "modulex-zaman-kurulus-surgu";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const kurulusSurgu = (s, P, az) => {
        const kok = s.querySelector("[data-surgu]");
        const r = kok && kok.querySelector("input[type=range]");
        const D = [...s.querySelectorAll("." + P + "-donem")];
        if (!r || D.length < 2) return;
        s.classList.add(P + "--js");
        kok.hidden = false;
        const tik = [...kok.querySelectorAll("[data-git]")];
        const sira = kok.querySelector("[data-gsira]");
        const dl = document.documentElement.lang || undefined;
        let f = null;
        try { f = new Intl.NumberFormat(dl); } catch (x) { f = null; }
        const sayi = (v) => (f ? f.format(v) : String(v));
        const sec = (i, ilk) => {
          i = Math.max(0, Math.min(D.length - 1, i));
          r.value = String(i);
          D.forEach((d, j) => {
            d.hidden = j !== i;
            d.classList.remove(P + "--gir");
          });
          if (!ilk && !az) { void D[i].offsetWidth; D[i].classList.add(P + "--gir"); }
          tik.forEach((t, j) => {
            if (j === i) t.setAttribute("aria-current", "step"); else t.removeAttribute("aria-current");
            t.classList.toggle(P + "--gecti", j < i);
          });
          s.style.setProperty("--oran", (i / (D.length - 1)).toFixed(3));
          if (sira) sira.textContent = sayi(i + 1) + " / " + sayi(D.length);
          r.setAttribute("aria-valuetext", [D[i].dataset.etiket, D[i].dataset.baslik].filter(Boolean).join(" · "));
        };
        r.addEventListener("input", () => sec(Number(r.value)));
        tik.forEach((t) => t.addEventListener("click", () => { sec(Number(t.dataset.git)); r.focus(); }));
        sec(Number(r.value) || 0, true);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      kurulusSurgu(s, P, az);
    });
  })();
</script>
